<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogFlow | Fleet Intelligence Dashboard</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <h2 style="color:var(--accent); letter-spacing: 1px;"><i class="fas fa-cube"></i> LOGFLOW</h2>
        <div class="nav-item active" id="nav-dash"><i class="fas fa-grid-2"></i> Dashboard</div>
        <div class="nav-item" id="nav-history"><i class="fas fa-map-location-dot"></i> Mission Logs</div>
        
        <div class="theme-btn" onclick="toggleTheme()">
            <i class="fas fa-adjust"></i>
            <span id="theme-text">Switch Mode</span>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <h1>Fleet Intel: <span id="user-display" style="color:var(--accent)">COMMANDER</span></h1>
            <p style="color:var(--subtext)">Operational Status: <span style="color:var(--success)">Ready for Deployment</span></p>
        </header>

        <section id="view-dashboard">
            <div class="grid-hub">
                <div class="hub-card" onclick="openOrder('Domestic Cargo', 2500, '₦')">
                    <i class="fas fa-truck-fast"></i>
                    <h3>Domestic</h3>
                    <h2 style="color:var(--success)">₦2,500<small>/kg</small></h2>
                </div>
                <div class="hub-card" onclick="openOrder('Global Cargo', 18, '$')">
                    <i class="fas fa-plane-departure"></i>
                    <h3>Global Hubs</h3>
                    <h2 style="color:var(--success)">$18.00<small>/kg</small></h2>
                </div>
                <div class="hub-card" onclick="openOrder('Fleet Solution', 85000, '₦')">
                    <i class="fas fa-handshake"></i>
                    <h3>Fleet Solution</h3>
                    <h2 style="color:var(--success)">₦85,000<small>/Day</small></h2>
                </div>
            </div>
        </section>

        <section id="view-logs" class="hidden">
            <h2>Active Mission Logs</h2>
            <div id="history-box">Syncing encrypted data...</div>
        </section>
    </main>

    <div class="modal hidden" id="order-modal">
        <div class="modal-box">
            <h3 id="form-title" style="margin-top:0">Secure Deployment</h3>
            
            <label class="input-label">Select Fleet Asset</label>
            <div class="vehicle-grid">
                <div class="v-option selected" onclick="selectVehicle('Bike', 0, this)"><i class="fas fa-motorcycle"></i><span>Bike</span></div>
                <div class="v-option" onclick="selectVehicle('Van', 15000, this)"><i class="fas fa-shuttle-van"></i><span>Van</span></div>
                <div class="v-option" onclick="selectVehicle('Truck', 45000, this)"><i class="fas fa-truck-moving"></i><span>Truck</span></div>
            </div>

            <div id="fleet-fields" class="hidden">
                <label class="input-label">Company Legal Name</label>
                <input type="text" id="inp-company" class="input-field" placeholder="e.g. Globex Corp">
                <label class="input-label">Company Email</label>
                <input type="email" id="inp-f-email" class="input-field" placeholder="office@gmail.com">
                <label class="input-label">Routes</label>
                <input type="text" id="inp-routes" class="input-field" placeholder="Lagos, Abuja, etc.">
                <label class="input-label">Period</label>
                <select id="inp-duration" class="input-field" onchange="calculate()">
                    <option value="1">1 Month</option><option value="6">6 Months</option>
                </select>
            </div>

            <div id="cargo-fields">
                <label class="input-label">Quantity (KG)</label>
                <input type="number" id="inp-qty" class="input-field" value="1" min="1" oninput="calculate()">
                <label class="input-label">Pickup</label>
                <input type="text" id="inp-pickup" class="input-field" placeholder="Full address">
                <label class="input-label">Destination</label>
                <input type="text" id="inp-dest" class="input-field" placeholder="State/City">
            </div>

            <div style="background:var(--bg); padding:15px; border-radius:15px; border:1px dashed var(--accent); text-align:center; margin-top:10px;">
                <h2 id="total-price" style="color:var(--success); margin:0;">₦0.00</h2>
            </div>
            
            <button class="btn-primary" onclick="payWithPaystack()">CONFIRM & PAY</button>
            <button class="btn-primary" style="background:none; color:var(--subtext)" onclick="document.getElementById('order-modal').classList.add('hidden')">ABORT</button>
        </div>
    </div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD4YJx2_oXeJezHfHQHfAtj08gjQiIbtB8", 
        projectId: "logflow-ef0f6", 
        appId: "1:717467944610:web:263380524c9da07a93b9fb" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let uid, email, activeRate, activeSymbol, activeType, selectedVehicle = "Bike", vehiclePremium = 0;

    // --- DRIVER LIST ---
    const fleetPersonnel = [
        { name: "Tunde Olatunji", phone: "08030000001" },
        { name: "Chidi Okafor", phone: "08140000002" },
        { name: "Aisha Bello", phone: "09050000003" }
    ];

    // --- NAVIGATION & THEME ---
    window.toggleTheme = () => {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        localStorage.setItem('theme', isDark ? 'light' : 'dark');
    };

    document.getElementById('nav-dash').onclick = () => {
        document.getElementById('view-dashboard').classList.remove('hidden');
        document.getElementById('view-logs').classList.add('hidden');
    };

    document.getElementById('nav-history').onclick = () => {
        document.getElementById('view-dashboard').classList.add('hidden');
        document.getElementById('view-logs').classList.remove('hidden');
    };

    // --- DYNAMIC VEHICLE SELECTION ---
    window.selectVehicle = (name, price, el) => {
        selectedVehicle = name; 
        vehiclePremium = price;
        document.querySelectorAll('.v-option').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected'); 
        calculate();
    };

    // --- MODIFIED OPEN ORDER (Swaps Bike/Truck for Air/Sea) ---
    window.openOrder = (type, rate, symbol) => {
        activeType = type; 
        activeRate = rate; 
        activeSymbol = symbol;
        
        const isFleet = type === 'Fleet Solution';
        const isGlobal = type === 'Global Cargo';
        
        const vehicleGrid = document.querySelector('.vehicle-grid');
        
        // Update UI for Global Hubs (Air vs Sea)
        if (isGlobal) {
            vehicleGrid.innerHTML = `
                <div class="v-option selected" onclick="selectVehicle('Cargo Plane', 50000, this)"><i class="fas fa-plane"></i><span>Air Freight</span></div>
                <div class="v-option" onclick="selectVehicle('Merchant Ship', 15000, this)"><i class="fas fa-ship"></i><span>Sea Freight</span></div>
            `;
            selectedVehicle = "Cargo Plane";
            vehiclePremium = 50000;
        } else {
            // Revert to Standard for Domestic/Fleet
            vehicleGrid.innerHTML = `
                <div class="v-option selected" onclick="selectVehicle('Bike', 0, this)"><i class="fas fa-motorcycle"></i><span>Bike</span></div>
                <div class="v-option" onclick="selectVehicle('Van', 15000, this)"><i class="fas fa-shuttle-van"></i><span>Van</span></div>
                <div class="v-option" onclick="selectVehicle('Truck', 45000, this)"><i class="fas fa-truck-moving"></i><span>Truck</span></div>
            `;
            selectedVehicle = "Bike";
            vehiclePremium = 0;
        }

        document.getElementById('fleet-fields').classList.toggle('hidden', !isFleet);
        document.getElementById('cargo-fields').classList.toggle('hidden', isFleet);
        document.getElementById('order-modal').classList.remove('hidden');
        calculate();
    };

    window.calculate = () => {
        let total = 0;
        if(activeType === 'Fleet Solution') {
            const duration = document.getElementById('inp-duration').value || 1;
            total = (duration * activeRate) + vehiclePremium;
        } else {
            const qty = document.getElementById('inp-qty').value || 1;
            total = (qty * activeRate) + vehiclePremium + 3000;
        }
        document.getElementById('total-price').innerText = activeSymbol + total.toLocaleString();
        return total;
    };

    // --- PAYMENT & GEOLOCATION ---
    window.payWithPaystack = () => {
        const handler = PaystackPop.setup({
            key: 'pk_test_c2816bd850d68619da3ee7136e5cc6383d89af17',
            email: email || "commander@logflow.com",
            amount: calculate() * 100,
            callback: (res) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => saveShipment(res.reference, pos.coords.latitude, pos.coords.longitude),
                        () => saveShipment(res.reference, 6.5244, 3.3792) // Default Lagos
                    );
                } else {
                    saveShipment(res.reference, null, null);
                }
            },
            onClose: () => alert('Deployment Aborted.')
        });
        handler.openIframe();
    };

    async function saveShipment(ref, lat, lng) {
        const assignedDriver = fleetPersonnel[Math.floor(Math.random() * fleetPersonnel.length)];
        const data = {
            uid, ref,
            tracking: "LF-" + Math.floor(100000 + Math.random() * 900000),
            type: activeType, 
            vehicle: selectedVehicle,
            cost: document.getElementById('total-price').innerText,
            status: "In Transit", 
            timestamp: serverTimestamp(),
            driverName: assignedDriver.name,
            driverPhone: assignedDriver.phone,
            coords: { lat, lng }
        };

        if(activeType === 'Fleet Solution') {
            data.company = document.getElementById('inp-company').value;
        } else {
            data.pickup = document.getElementById('inp-pickup').value;
            data.dest = document.getElementById('inp-dest').value;
        }

        await addDoc(collection(db, "shipments"), data);
        alert("Mission Authorized! Logistic assets deployed.");
        location.reload();
    }

    onAuthStateChanged(auth, user => { 
        if (user) { 
            uid = user.uid; email = user.email; 
            document.getElementById('user-display').innerText = (user.displayName || user.email.split('@')[0]).toUpperCase();
            loadLogs(); 
        }
    });

    function loadLogs() {
        const q = query(collection(db, "shipments"), where("uid", "==", uid), orderBy("timestamp", "desc"));
        onSnapshot(q, snap => {
            let html = "";
            snap.forEach(doc => {
                const d = doc.data();
                html += `
                <div class="history-card">
                    <div style="display:flex; justify-content:space-between;">
                        <div>
                            <small style="color:var(--accent); font-weight:800;">ID: ${d.tracking}</small>
                            <h3 style="margin:5px 0">${d.type} - ${d.vehicle}</h3>
                        </div>
                        <div style="text-align:right">
                            <b style="color:var(--success)">${d.cost}</b><br>
                            <small style="color:var(--subtext)">${d.status}</small>
                        </div>
                    </div>
                    <div class="track-bar">
                        <div class="step active"><span class="step-label">Ordered</span></div>
                        <div class="step active"><span class="step-label">Assigned</span></div>
                        <div class="step active"><span class="step-label">Transit</span></div>
                        <div class="step"><span class="step-label">Arrived</span></div>
                    </div>
                    <div class="driver-card">
                        <i class="fas fa-id-badge" style="font-size:24px; color:var(--accent)"></i>
                        <div>
                            <b>${d.driverName}</b><br>
                            <small style="color:var(--subtext)">Official Dispatcher</small>
                        </div>
                        <a href="tel:${d.driverPhone}" class="call-btn"><i class="fas fa-phone"></i></a>
                    </div>
                </div>`;
            });
            document.getElementById('history-box').innerHTML = html || "No history found.";
        });
    }
</script>
</body>
</html>
