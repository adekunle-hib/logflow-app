<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Premium Logistics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <section class="contact-wrapper section-padding">
        <div class="container">
            <div class="split-layout">
                
                <div class="info-side">
                    <span class="tag">Contact Us</span>
                    <h1>Let's bridge the gap <br>to your <span>global</span> markets.</h1>
                    <p>Our team is on standby across 36 states and international hubs to ensure your cargo moves without friction.</p>

                    <div class="contact-methods">
                        <a href="tel:+2349153268586" class="method-item">
                            <div class="icon-box"><i class="fa-solid fa-phone"></i></div>
                            <div>
                                <h4>Call Support</h4>
                                <span>0915 326 8586</span>
                            </div>
                        </a>

                        <a href="mailto:ops@yourlogistics.com" class="method-item">
                            <div class="icon-box"><i class="fa-solid fa-envelope"></i></div>
                            <div>
                                <h4>Email Operations</h4>
                                <span>ops@yourlogistics.com</span>
                            </div>
                        </a>

                      <a href="https://wa.me/2349153268586?text=Hi%20Premium%20Logistics,%20I%20need%20help%20with%20a%20shipment." class="method-item whatsapp" target="_blank">
    <div class="icon-box">
        <i class="fa-brands fa-whatsapp"></i>
    </div>
    <div>
        <h4>WhatsApp Business</h4>
        <span>Online | Click to Chat</span>
    </div>
</a>

                <div class="form-side">
                    <div class="glass-card">
                        <form id="logisticsForm" action="https://formspree.io/f/your_id" method="POST">
                            <div class="form-group">
                                <label>What's your name?</label>
                                <input type="text" name="name" placeholder="Full name" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" name="email" placeholder="email@company.com" required>
                            </div>
                            <div class="form-group">
                                <label>Service Inquiry</label>
                                <select name="service">
                                    <option value="Domestic">Domestic (Nigeria 36 States)</option>
                                    <option value="International">International (UK/US)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Message</label>
                                <textarea name="message" rows="4" placeholder="How can we help?" required></textarea>
                            </div>

                            <button type="submit" id="submitBtn" class="submit-btn">
                                <span>Submit Inquiry</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                            <div id="formStatus"></div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script>
        const contactForm = document.getElementById('logisticsForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('formStatus');

        contactForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // UI Feedback
            submitBtn.disabled = true;
            submitBtn.querySelector('span').innerText = 'Sending...';
            statusDiv.innerText = ""; 

            fetch(contactForm.action, {
                method: 'POST',
                body: new FormData(contactForm),
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    statusDiv.innerText = "Message sent successfully!";
                    statusDiv.style.color = "#065f46"; // Success Green
                    contactForm.reset();
                } else {
                    statusDiv.innerText = "Error sending message. Please try WhatsApp.";
                    statusDiv.style.color = "#991b1b"; // Error Red
                }
            }).catch(error => {
                statusDiv.innerText = "Connection error. Please check your internet.";
                statusDiv.style.color = "#991b1b";
            }).finally(() => {
                submitBtn.disabled = false;
                submitBtn.querySelector('span').innerText = 'Submit Inquiry';
            });
        });

        // Optional: Professional alert before leaving site
const whatsappLink = document.querySelector('.method-item.whatsapp');
whatsappLink.addEventListener('click', function(e) {
    const confirmChat = confirm("You are now opening WhatsApp to chat with our Logistics Team. Proceed?");
    if (!confirmChat) {
        e.preventDefault(); // Stops them from leaving if they click Cancel
    }
});
    </script>
</body>
</html>
