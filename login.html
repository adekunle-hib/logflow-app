<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Premium Logistics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="main.css">
</head>

<body class="auth-page-bg">

    <div class="auth-screen">
        <div class="auth-box">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Login to manage your shipments.</p>
            </div>

            <div class="auth-google-wrapper">
                <button type="button" id="googleLoginBtn" class="auth-action-btn google-btn"
                    style="background: white; color: #444; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                    <span>Sign in with Google</span>
                </button>
            </div>

            <div class="auth-divider"><span>or login with email</span></div>

            <form id="loginForm" class="auth-form">
                <div class="auth-field">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="name@company.com" required>
                </div>
                <div class="auth-field">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-action-btn" id="loginBtn">
                    <span>Log In</span>
                </button>
            </form>

            <p class="auth-switch-text">New here? <a href="signup.html">Create account</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4YJx2_oXeJezHfHQHfAtj08gjQiIbtB8",
            authDomain: "logflow-ef0f6.firebaseapp.com",
            projectId: "logflow-ef0f6",
            storageBucket: "logflow-ef0f6.firebasestorage.app",
            messagingSenderId: "717467944610",
            appId: "1:717467944610:web:263380524c9da07a93b9fb",
            measurementId: "G-X3P84VMMY6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- EMAIL/PASSWORD LOGIN ---
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();

                // .trim() is VERY important here to remove accidental spaces
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;
                const btn = document.getElementById('loginBtn');

                btn.innerText = "Authenticating...";

                signInWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        console.log("Logged in successfully!", userCredential.user);
                        localStorage.setItem('isLoggedIn', 'true');
                        window.location.href = "console.html"; // Or dashboard.html
                    })
                    .catch((error) => {
                        btn.innerText = "Log In";
                        console.error("Full Error Object:", error);
                        // This alert will now tell us the SPECIFIC reason
                        alert("Login Failed: " + error.code);
                    });
            });
        }

        // --- GOOGLE LOGIN (The Popup version) ---
        const googleBtn = document.getElementById('googleLoginBtn');
        if (googleBtn) {
            googleBtn.addEventListener('click', () => {
                const provider = new GoogleAuthProvider();
                signInWithPopup(auth, provider)
                    .then((result) => {
                        window.location.href = "console.html";
                    })
                    .catch((error) => {
                        alert("Google Error: " + error.code);
                    });
            });
        }
    </script>
</body>

</html>
