<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Premium Logistics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page-bg">

    <div class="auth-screen">
        <div class="auth-box">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Join the global network in seconds.</p>
            </div>

            <div class="auth-google-wrapper">
                <button type="button" id="googleSignupBtn" class="auth-action-btn" style="background: white; color: #444; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; cursor: pointer; padding: 12px; border-radius: 8px; font-weight: 600; font-family: inherit;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                    <span>Sign up with Google</span>
                </button>
            </div>

            <div class="auth-divider"><span>or register manually</span></div>

            <form id="signupForm" class="auth-form">
                <div class="auth-field">
                    <label>Full Name</label>
                    <input type="text" id="fullname" placeholder="John Doe" required>
                </div>
                <div class="auth-field">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
                <div class="auth-field">
                    <label>Create Password</label>
                    <input type="password" id="password" placeholder="Min. 8 characters" required>
                </div>

                <button type="submit" class="auth-action-btn" id="signupBtn">
                    <span>Create Account</span>
                </button>
            </form>

            <p class="auth-switch-text">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            updateProfile, 
            GoogleAuthProvider, 
            signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4YJx2_oXeJezHfHQHfAtj08gjQiIbtB8",
            authDomain: "logflow-ef0f6.firebaseapp.com",
            projectId: "logflow-ef0f6",
            storageBucket: "logflow-ef0f6.firebasestorage.app",
            messagingSenderId: "717467944610",
            appId: "1:717467944610:web:263380524c9da07a93b9fb",
            measurementId: "G-X3P84VMMY6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // --- GOOGLE SIGNUP LOGIC ---
        const googleBtn = document.getElementById('googleSignupBtn');
        googleBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    console.log("Google Signup Success:", result.user.displayName);
                    window.location.href = "console.html";
                })
                .catch((error) => {
                    console.error("Google Error:", error.code);
                    alert("Google Access Blocked: Please ensure you are visiting 'http://localhost:5500' and not the IP address.");
                });
        });

        // --- MANUAL SIGNUP LOGIC ---
        const signupForm = document.getElementById('signupForm');
        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('fullname').value;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('signupBtn');

            btn.innerText = "Registering on Cloud...";
            btn.disabled = true;

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    return updateProfile(userCredential.user, {
                        displayName: name
                    });
                })
                .then(() => {
                    alert("Account created successfully!");
                    window.location.href = "console.html"; 
                })
                .catch((error) => {
                    btn.innerText = "Create Account";
                    btn.disabled = false;
                    console.error(error.code);
                    alert("Signup Error: " + error.message);
                });
        });
    </script>
</body>
</html>
